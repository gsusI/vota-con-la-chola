name: Live ETL Publish

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Hugging Face and deploy Cloudflare when secrets are present"
        required: false
        default: false
        type: boolean
      release_scope:
        description: "Run the full data release or publish the committed static site only"
        required: false
        default: "full"
        type: choice
        options:
          - "full"
          - "site"

concurrency:
  group: live-etl-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  live-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DB_PATH: etl/data/staging/politicos-es.live.db
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      HF_DATASET_REPO_ID: ${{ secrets.HF_DATASET_REPO_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVE_ETL_PUBLISH_REQUESTED: ${{ github.event_name == 'schedule' || github.event.inputs.publish == 'true' }}
      SITE_ONLY_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_scope == 'site' }}
      ACCOUNTABILITY_MIN_ENTRIES: "0"
      ACCOUNTABILITY_MIN_ACTORS: "0"
      ACCOUNTABILITY_MIN_ISSUES: "0"
      ACCOUNTABILITY_MIN_EVIDENCE_API_ISSUE_CLUSTERS: "0"
      ACCOUNTABILITY_MIN_RESOLUTION_PCT: "0.999"
      HF_REQUIRE_QUALITY_REPORT: "1"
      HF_REQUIRE_LIBERTY_ATLAS_RELEASE_LATEST: "0"
      INITIATIVE_QUALITY_ACTIONABLE_SCOPE: "linked_to_votes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Normalize snapshot date
        run: |
          echo "SNAPSHOT_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Build ETL image
        if: env.SITE_ONLY_RELEASE != 'true'
        run: docker compose build etl

      - name: Run live ETL
        if: env.SITE_ONLY_RELEASE != 'true'
        run: just etl-live

      - name: Enforce tracker truth
        if: env.SITE_ONLY_RELEASE != 'true'
        run: |
          just etl-tracker-status
          just etl-tracker-gate

      - name: Enforce current Andalucía water receipt
        run: |
          python3 scripts/export_andalucia_2026_water_commitment_receipt.py \
            --as-of-date "$SNAPSHOT_DATE" \
            --max-age-days 8
          node --test tests/test_andalucia_2026_water_receipt.js

      - name: Build public static artifacts
        run: |
          if [ "$SITE_ONLY_RELEASE" = "true" ]; then
            GH_PAGES_NEXT_PRIME_EXPORT=0 just cloudflare-pages-build
          else
            HF_DATASET_REPO_ID="${HF_DATASET_REPO_ID:-local/vota-con-la-chola-data}" \
              HF_USERNAME="${HF_USERNAME:-local}" \
              just etl-publish-hf-dry-run
            just cloudflare-pages-refresh-data
          fi

      - name: Publish Hugging Face snapshot
        if: env.LIVE_ETL_PUBLISH_REQUESTED == 'true' && env.SITE_ONLY_RELEASE != 'true'
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN missing; checked dry-run only."
            exit 0
          fi
          if [ -z "$HF_DATASET_REPO_ID" ] && [ -z "$HF_USERNAME" ]; then
            echo "HF_DATASET_REPO_ID/HF_USERNAME missing; checked dry-run only."
            exit 0
          fi
          just etl-publish-hf

      - name: Deploy Cloudflare Pages
        if: env.LIVE_ETL_PUBLISH_REQUESTED == 'true'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets missing; build artifact only."
            exit 0
          fi
          if [ "$SITE_ONLY_RELEASE" = "true" ]; then
            cd ui/gh-pages-next
            npx wrangler pages deploy out --project-name "vota-con-la-chola"
          else
            just cloudflare-pages-deploy
          fi

      - name: Publish votaconlachola.org static branch
        if: env.LIVE_ETL_PUBLISH_REQUESTED == 'true'
        run: just votaconlachola-gh-pages-publish
