services:
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    image: vota-con-la-chola-etl:local
    working_dir: /workspace
    # Root by default; CI sets ETL_UID/ETL_GID/ETL_HOME so files written to the bind mount
    # stay owned by the runner and host-side steps can open them.
    user: "${ETL_UID:-0}:${ETL_GID:-0}"
    volumes:
      - ./:/workspace
    environment:
      - HOME=${ETL_HOME:-/root}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - HF_TOKEN
      - HF_USERNAME
      - HF_DATASET_REPO_ID
      - HF_RAW_DATASET_REPO_ID
    entrypoint: ["/bin/sh", "-lc"]
    command: ["python3 --version"]

  graph-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: vota-con-la-chola-etl:local
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - TZ=UTC
    ports:
      # Publish on loopback only: the API has a write endpoint and no auth.
      - "127.0.0.1:${GRAPH_PORT:-8080}:8080"
    entrypoint: ["/bin/sh", "-lc"]
    command:
      [
        "python3 scripts/graph_ui_server.py --db ${DB_PATH:-etl/data/staging/politicos-es.db} --host 0.0.0.0 --port 8080",
      ]
