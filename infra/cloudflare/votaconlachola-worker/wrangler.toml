name = "votaconlachola-org"
main = "src/index.js"
compatibility_date = "2026-02-12"
account_id = "2a9c5bd32808734be6ee294d77e05ffb"

# Bind to the zone route (standard Workers route).
routes = [
  { pattern = "votaconlachola.org/*", zone_name = "votaconlachola.org" }
]

# Static shell and hashed assets are served first; every other path is read from R2.
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Published site origin (synced by scripts/publish_site_origin.py).
[[r2_buckets]]
binding = "SITE"
bucket_name = "vclc-site"
